<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
    <title>Data Karyawan</title>
  </head>
  <body>
    <div class="modal fade" id="ModalKaryawan" tabindex="-1" aria-labelledby="ModalKaryawanLabel" aria-hidden="true"></div>
    <div class="container mt-5">
      <button type="button" class="btn btn-primary add-karyawan">Tambah Karyawan</button>
      <table class="table mt-3">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nama Lengkap</th>
            <th>L/P</th>
            <th>Alamat</th>
          </tr>
        </thead>
        <tbody>
          {{.data}}
        </tbody>
      </table>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN" crossorigin="anonymous"></script>
    <script>
      document.querySelector('.add-karyawan').addEventListener('click', async function () {
        const modalElement = document.getElementById('ModalKaryawan');

        try {
          const response = await fetch('/karyawan/get-form');
          if (!response.ok) {
            throw new Error(`Gagal memuat form (${response.status})`);
          }

          modalElement.innerHTML = await response.text();
          bootstrap.Modal.getOrCreateInstance(modalElement).show();
        } catch (error) {
          console.error(error);
          window.alert('Form karyawan gagal dimuat. Silakan coba lagi.');
        }
      });
    </script>
  </body>
</html>
