<div class="modal-dialog" role="document">
  <div class="modal-content">
    <form>
      <div class="modal-header">
        <h5 class="modal-title" id="ModalKaryawanLabel">Tambah Karyawan</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label for="nama-karyawan" class="form-label">Nama Lengkap</label>
          <input type="text" class="form-control" id="nama-karyawan" name="nama_karyawan" required>
        </div>
        <div class="mb-3">
          <label for="jenis-kelamin" class="form-label">Jenis Kelamin</label>
          <select class="form-select" id="jenis-kelamin" name="jenis_kelamin" required>
            <option value="" selected disabled>Pilih jenis kelamin</option>
            <option value="L">Laki-laki</option>
            <option value="P">Perempuan</option>
          </select>
        </div>
        <div class="mb-3">
          <label for="alamat-karyawan" class="form-label">Alamat</label>
          <textarea class="form-control" id="alamat-karyawan" name="alamat" rows="3" required></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
        <button type="submit" class="btn btn-primary">Simpan</button>
      </div>
    </form>
  </div>
</div>
